<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Hull lab</title>
  <style>
    :root { color-scheme: dark; }
    body { margin: 0; background: #0B1730; color: #E6F1FF; font: 14px/1.4 system-ui, sans-serif; }
    h1 { font: italic 900 20px system-ui; margin: 16px; letter-spacing: 0.04em; }
    #turn { display: block; width: 100%; height: 640px; }
    table { border-collapse: collapse; margin: 16px; }
    th { font-weight: 700; text-align: left; padding: 6px 12px; color: #9FC4FF; }
    td { padding: 6px 12px; vertical-align: middle; border-top: 1px solid #1E3358; }
    .big { width: 160px; height: 160px; image-rendering: auto; }
    .old { image-rendering: pixelated; }
    .chip { display: inline-flex; gap: 8px; align-items: center; padding: 6px; border-radius: 8px; background: #16294A; }
    .chip.light { background: #DCE3EE; }
    .s50 { width: 50px; height: 50px; } .s26 { width: 26px; height: 26px; }
    #lineup { display: grid; grid-template-columns: repeat(auto-fill, minmax(150px, 1fr)); gap: 8px; margin: 0 16px 16px; }
    #lineup figure { margin: 0; padding: 6px; border-radius: 10px; background: radial-gradient(#22406E, #12223F); text-align: center; }
    #lineup img { width: 138px; height: 138px; display: block; margin: 0 auto; }
    #lineup figcaption { font: italic 800 12px system-ui; letter-spacing: 0.04em; color: #CFE2FF; text-transform: uppercase; }
  </style>
</head>
<body>
  <h1>HULL LAB · old pixel art vs new models</h1>
  <div id="lineup"></div>
  <canvas id="turn"></canvas>
  <table id="grid"></table>
  <script type="module" src="/src/dev/hulls.ts"></script>
</body>
</html>
